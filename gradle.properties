# ===================== \u7B2C\u4E09\u65B9\u7248\u672C =====================
# Spring Boot \u5168\u5BB6\u6876\u7248\u672C\uFF0C\u6240\u6709 org.springframework.* / com.fasterxml / org.junit \u7B49\u7531\u5B83\u7EDF\u4E00\u7BA1\u7406
springBootVersion=4.1.2
# \u4E0D\u5728\u4EFB\u4F55 BOM \u91CC\u7684\u7B2C\u4E09\u65B9\u4F9D\u8D56
# org.bouncycastle:bcpkix-jdk18on
bouncyCastleVersion=1.86
# com.google.zxing:javase
zxingVersion=3.5.4
# io.swagger.core.v3:swagger-annotations
swaggerAnnotationsVersion=3.0.0
# org.springdoc:springdoc-openapi-starter-webmvc-ui
springdocVersion=3.2.0
# software.amazon.awssdk:bom —— 统一约束 AWS SDK for Java v2（含 s3 / auth / presigner 等）
awsSdkVersion=2.57.8
# org.apache.sshd:sshd-core —— 无官方 BOM，按 artifact 逐个约束
sshdVersion=2.20.1
# com.webauthn4j:webauthn4j-core —— WebAuthn（通行密钥）凭证校验
webauthn4jVersion=0.31.11.RELEASE
# org.jetbrains:annotations —— webauthn4j 的 API 签名带 @NotNull，它自己只声明 compileOnly
jetbrainsAnnotationsVersion=26.1.0
# com.adobe.testing:s3mock-junit5 —— 仅测试用（ext-oss 的 S3 后端进程内往返），不进 BOM
s3mockVersion=5.2.3
# com.twelvemonkeys.imageio:imageio-webp
# 可选：仅业务方需要读写 WebP 时引入，ext-tool 本身不依赖它
twelveMonkeysVersion=3.15.3
# ===================== \u9879\u76EE\u81EA\u8EAB =====================
version=4.1.0
