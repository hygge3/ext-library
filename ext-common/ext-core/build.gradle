description = '核心功能模块'

dependencies {
    api project(':ext-common:ext-tool')
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-aspectj'
}

// banner 里的 ${revision} 在构建期换成项目版本；只换这一处，其余 ${...} 留给 Spring Boot
// 版本号在配置期取出：Execution 阶段碰 project 会被 Gradle 10 判为弃用
def bannerVersion = version.toString()
processResources {
    filesMatching('banner.txt') {
        filter(org.apache.tools.ant.filters.ReplaceTokens,
                tokens: [revision: bannerVersion],
                beginToken: '${', endToken: '}')
    }
}
