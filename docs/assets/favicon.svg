<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ext-library">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <g fill="#6366f1" fill-opacity="0.28">
    <rect x="5" y="5" width="23" height="23" rx="7"/>
    <rect x="36" y="36" width="23" height="23" rx="7"/>
  </g>
  <rect x="5" y="36" width="23" height="23" rx="7" fill="url(#accent)"/>
  <!-- 空槽向内缩 4.5 = 描边宽度的一半，使 ink 外沿与实心格对齐 -->
  <rect x="40.5" y="9.5" width="14" height="14" rx="2.5"
        fill="none" stroke="#6366f1" stroke-width="9" stroke-opacity="0.45"/>
</svg>
