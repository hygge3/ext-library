<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 174" width="174" height="174" role="img" aria-label="ext-library">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- 已装入的模块 -->
  <g fill="#e2e8f0">
    <rect x="5" y="5" width="77" height="77" rx="22"/>
    <rect x="92" y="92" width="77" height="77" rx="22"/>
  </g>
  <rect x="5" y="92" width="77" height="77" rx="22" fill="url(#accent)"/>

  <!-- 空槽：等待接入的扩展模块。向内缩 2.5 = 描边宽度的一半，
       使描边 ink 外沿与实心格边界严格对齐，视觉尺寸一致 -->
  <rect x="94.5" y="7.5" width="72" height="72" rx="19.5"
        fill="none" stroke="#e2e8f0" stroke-width="5" stroke-opacity="0.45"/>
</svg>
