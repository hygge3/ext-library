<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#primaryGradient)" filter="url(#shadow)"/>

  <!-- 装饰性模块块 (代表模块化) -->
  <rect x="25" y="25" width="30" height="30" rx="6" fill="url(#accentGradient)" opacity="0.6"/>
  <rect x="145" y="25" width="30" height="30" rx="6" fill="url(#accentGradient)" opacity="0.6"/>
  <rect x="25" y="145" width="30" height="30" rx="6" fill="url(#accentGradient)" opacity="0.6"/>

  <!-- EXT 文字 -->
  <text x="100" y="125"
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="56"
        font-weight="800"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-2">EXT</text>

  <!-- 下划线装饰 -->
  <rect x="50" y="138" width="100" height="4" rx="2" fill="url(#accentGradient)"/>

  <!-- 连接线 (代表扩展) -->
  <line x1="145" y1="145" x2="175" y2="175" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <circle cx="175" cy="175" r="5" fill="url(#accentGradient)"/>
</svg>
