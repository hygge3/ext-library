<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 深色主题渐变 -->
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深色背景 -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#darkGradient)"/>

  <!-- 发光边框 -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40"
        fill="none" stroke="url(#cyanGradient)" stroke-width="2" opacity="0.6"/>

  <!-- 装饰性模块块 -->
  <rect x="25" y="25" width="30" height="30" rx="6" fill="url(#cyanGradient)" opacity="0.4"/>
  <rect x="145" y="25" width="30" height="30" rx="6" fill="url(#cyanGradient)" opacity="0.4"/>
  <rect x="25" y="145" width="30" height="30" rx="6" fill="url(#cyanGradient)" opacity="0.4"/>

  <!-- EXT 文字 (发光效果) -->
  <text x="100" y="125"
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="56"
        font-weight="800"
        fill="url(#cyanGradient)"
        text-anchor="middle"
        letter-spacing="-2"
        filter="url(#glow)">EXT</text>

  <!-- 下划线装饰 -->
  <rect x="50" y="138" width="100" height="4" rx="2" fill="#a5b4fc"/>

  <!-- 连接点 -->
  <line x1="145" y1="145" x2="175" y2="175" stroke="url(#cyanGradient)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="175" cy="175" r="5" fill="url(#cyanGradient)"/>
</svg>
