rootProject.name = 'ext-library'

dependencyResolutionManagement {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}

// ==================== ext-bom ====================
include 'ext-bom'

// ==================== ext-common ====================
include 'ext-common:ext-tool'
include 'ext-common:ext-core'
include 'ext-common:ext-json'
include 'ext-common:ext-servlet'
include 'ext-common:ext-http'
include 'ext-common:ext-useragent'
include 'ext-common:ext-qrcode'
include 'ext-common:ext-logback'

// ==================== ext-infra ====================
include 'ext-infra:ext-redis'
include 'ext-infra:ext-cache'
include 'ext-infra:ext-mail'
include 'ext-infra:ext-postgres'
include 'ext-infra:ext-lock'
include 'ext-infra:ext-jdbc'
include 'ext-infra:ext-job'
include 'ext-infra:ext-i18n'
include 'ext-infra:ext-oss'

// ==================== ext-security ====================
include 'ext-security'

// ==================== ext-crypto ====================
include 'ext-crypto'

// ==================== ext-web ====================
include 'ext-web:ext-mvc'
include 'ext-web:ext-realtime'

// ==================== ext-enhance ====================
include 'ext-enhance:ext-captcha'
include 'ext-enhance:ext-idempotent'
include 'ext-enhance:ext-api-crypto'
include 'ext-enhance:ext-ratelimit'
include 'ext-enhance:ext-audit'
