plugins {
    id 'java-platform'
    id 'maven-publish'
}

description = 'Ext Library BOM - 依赖版本统一管理'

javaPlatform {
    allowDependencies()
}

// ===================== Spring Boot 全家桶 =====================
// 由 spring-boot-dependencies 统一管理，避免每个模块重复导入
dependencies {
    constraints {
        api "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

// ===================== 其他第三方依赖 =====================
dependencies {
    constraints {
        api "org.bouncycastle:bcpkix-jdk18on:${bouncyCastleVersion}"
        api "com.google.zxing:javase:${zxingVersion}"
        api "io.swagger.core.v3:swagger-annotations:${swaggerAnnotationsVersion}"
        // webauthn4j 的 API 签名带 @NotNull，但它自己只声明 compileOnly，消费方得自带
        api "com.webauthn4j:webauthn4j-core:${webauthn4jVersion}"
        api "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
        api "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
        // TwelveMonkeys ImageIO：补足 JDK ImageIO 缺失的图片格式（WebP、PSD、ICNS 等）
        // 纯 Java、SPI 自动注册，业务方按需引入相应 artifact，版本由本 BOM 统一
        api "com.twelvemonkeys.imageio:imageio-webp:${twelveMonkeysVersion}"
    }
}

// ===================== 自带 BOM 的第三方 =====================
// AWS SDK for Java v2 导官方 BOM（ext-oss 的 S3 与预签名能力），
// 不把几十个 service client 拆成 constraint，避免跟不上官方拆包节奏
dependencies {
    api platform("software.amazon.awssdk:bom:${awsSdkVersion}")
}

// ======================= ext-common 层 =====================
dependencies {
    constraints {
        api project(':ext-common:ext-tool')
        api project(':ext-common:ext-core')
        api project(':ext-common:ext-json')
        api project(':ext-common:ext-servlet')
        api project(':ext-common:ext-http')
        api project(':ext-common:ext-useragent')
        api project(':ext-common:ext-qrcode')
        api project(':ext-common:ext-logback')
    }
}

// ======================= ext-infra 层 =====================
dependencies {
    constraints {
        api project(':ext-infra:ext-redis')
        api project(':ext-infra:ext-cache')
        api project(':ext-infra:ext-mail')
        api project(':ext-infra:ext-postgres')
        api project(':ext-infra:ext-lock')
        api project(':ext-infra:ext-jdbc')
        api project(':ext-infra:ext-job')
        api project(':ext-infra:ext-i18n')
        api project(':ext-infra:ext-oss')
    }
}

// ======================= 安全/加密层 =====================
dependencies {
    constraints {
        api project(':ext-security')
        api project(':ext-crypto')
    }
}

// ======================= ext-web 层 =====================
dependencies {
    constraints {
        api project(':ext-web:ext-mvc')
        api project(':ext-web:ext-realtime')
    }
}

// ======================= ext-enhance 层 =====================
dependencies {
    constraints {
        api project(':ext-enhance:ext-captcha')
        api project(':ext-enhance:ext-idempotent')
        api project(':ext-enhance:ext-api-crypto')
        api project(':ext-enhance:ext-ratelimit')
        api project(':ext-enhance:ext-audit')
    }
}

publishing {
    publications {
        bom(MavenPublication) {
            from components.javaPlatform
            artifactId = 'ext-bom'
            pom {
                name = 'ext-bom'
                description = project.description
                url = 'https://github.com/hygge3/ext-library'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
            }
        }
    }
}
